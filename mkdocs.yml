INHERIT: mkdocs.maybe-insiders.yml
site_name: Chinese Docs
site_description: Chinese learning notes for pinyin, vocabulary, grammar, speaking, and class sessions
site_url: https://ricardotran92.github.io/chinese-docs/
use_directory_urls: false # To get img locations easily

theme:
  name: material
  custom_dir: overrides
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
  - content.code.annotate
  - content.code.copy
  - content.footnote.tooltips
  - content.tabs.link
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.path
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow
  - layout.wide
  icon:
    repo: fontawesome/brands/github-alt
  logo: img/icon-white.svg
  favicon: img/favicon.png
  language: en

repo_name: ricardotran92/docs
repo_url: https://github.com/ricardotran92/docs

plugins:
  search: null
  macros:
    include_yaml:
    - en/data/external_links.yml
    - en/data/github_sponsors.yml
    - en/data/people.yml
    - en/data/contributors.yml
    - en/data/translators.yml
    - en/data/translation_reviewers.yml
    - en/data/skip_users.yml
    - en/data/members.yml
    - en/data/sponsors_badge.yml
    - en/data/sponsors.yml
    - en/data/topic_repos.yml
  mkdocstrings:
    handlers:
      python:
        options:
          extensions:
          - griffe_typingdoc
          - pymdownx.arithmatex
          show_root_heading: true
          show_if_no_docstring: true
          preload_modules:
          - httpx
          - starlette
          inherited_members: true
          members_order: source
          separate_signature: true
          unwrap_annotated: true
          filters:
          - '!^_'
          merge_init_into_class: true
          docstring_section_style: spacy
          signature_crossrefs: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          generic: true

nav:
